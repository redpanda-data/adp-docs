# Reconciles the rpk ai stub pages and nav against the generated partials in
# redpanda-data/docs. Triggered by the docs repo whenever rpk ai partials
# change on its main branch (sender: notify-adp-docs-rpk-ai.yml there), and
# runnable manually. The reconciler is a full converge, so a run is always
# safe: it creates stubs for new partials, deletes managed stubs whose
# partial is gone, rebuilds the rpk ai nav block, and proposes page aliases
# for likely renames in the PR body (reviewer confirms those).
name: Sync rpk ai stubs

on:
  repository_dispatch:
    types: [sync-rpk-ai-stubs]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: sync-rpk-ai-stubs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Resolve doc-tools from npm at run time rather than this repo's
      # lockfile: the pinned lockfile version predates the rpk-plugin-stubs
      # command, and this workflow needs none of the repo's other
      # dependencies. The floor guarantees the command exists.
      - name: Reconcile stubs against docs main
        run: |
          npx --yes -p @redpanda-data/docs-extensions-and-macros@^5.3.0 \
            doc-tools generate rpk-plugin-stubs \
            --plugin ai \
            --summary-file "${{ runner.temp }}/summary.md"

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Stubs already match the partials."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --staged --name-status | head -20
          fi

      - name: Build PR body
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          {
            cat "${{ runner.temp }}/summary.md"
            echo ""
            echo "## Review notes"
            echo ""
            echo "- If a deleted/created pair above is a rename, add the proposed \`:page-aliases:\` line to the new stub before merging so published URLs keep working."
            echo "- Generated by [rpk-plugin-stubs](https://github.com/redpanda-data/docs-extensions-and-macros/tree/main/tools/rpk-docs) after an rpk ai partial change landed on docs main."
          } > "${{ runner.temp }}/pr-body.md"

      # Bot token so the generated PR triggers this repo's own Actions
      # (secrets.GITHUB_TOKEN PRs do not)
      - name: Configure AWS credentials
        if: steps.changes.outputs.has_changes == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - name: Fetch actions bot token
        if: steps.changes.outputs.has_changes == 'true'
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          branch: sync-rpk-ai-stubs
          title: "docs: sync rpk ai stubs with generated partials"
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: "docs: sync rpk ai stubs with generated partials"
          delete-branch: true
          labels: |
            automated
