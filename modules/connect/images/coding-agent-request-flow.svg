a, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">No provider key</text><text x="0" y="90.19541015624999" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">stored here</text></g><g transform="translate(406 274) rotate(0 94.072265625 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Run coding agent</text></g><g transform="translate(406 316) rotate(0 102.718505859375 36.224999999999994)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">rpk ai run</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Uses selected context</text></g><g transform="translate(710 244) rotate(0 62.02734375 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">AI Gateway</text></g><g transform="translate(710 286) rotate(0 91.634033203125 48.30000000000001)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Authenticates caller</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Routes native API</text><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Applies policy</text><text x="0" y="90.19541015624999" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Records usage</text></g><g transform="translate(1054 274) rotate(0 70.03125 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">LLM provider</text></g><g transform="translate(1054 316) rotate(0 107.3994140625 36.224999999999994)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Managed access,</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">AWS Bedrock, or</text><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">enterprise passthrough</text></g><g transform="translate(454 599) rotate(0 64.693359375 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Secret store</text></g><g transform="translate(454 641) rotate(0 114.966796875 24.149999999999977)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Provider credentials stay</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">in the data plane</text></g><g transform="translate(874 599) rotate(0 84.05859375 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Cost and usage</text></g><g transform="translate(874 641) rotate(0 102.728759765625 24.149999999999977)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Tokens, requests, and</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">spend roll up centrally</text></g></svg>