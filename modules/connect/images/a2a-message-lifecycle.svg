blic</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">agent card</text><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="90.19541015624999" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Read capabilities,</text><text x="0" y="114.34541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">interfaces, and</text><text x="0" y="138.49541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">protocol version</text></g><g transform="translate(599 269) rotate(0 50.033203125 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2. Sign in</text></g><g transform="translate(599 311) rotate(0 77.032470703125 24.150000000000006)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Get a short-lived</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">access token</text></g><g transform="translate(859 239) rotate(0 93.392578125 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3. Send message</text></g><g transform="translate(859 281) rotate(0 92.818359375 60.375)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Use supported</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">interface and</text><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">protocol version</text><text x="0" y="90.19541015624999" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic"/><text x="0" y="114.34541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Agent stays opaque</text></g><g transform="translate(1134 239) rotate(0 56.6953125 13.800000000000011)"><text x="0" y="20.280468749999997" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">4. Receive</text></g><g transform="translate(1134 281) rotate(0 78.1962890625 48.30000000000001)"><text x="0" y="17.74541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Direct response</text><text x="0" y="41.895410156249994" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">or streamed task</text><text x="0" y="66.04541015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">status and</text><text x="0" y="90.19541015624999" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#cbd5e1" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">artifacts</text></g><g transform="translate(333 603) rotate(0 325.72265625 11.5)"><text x="0" y="16.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#f8fafc" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">A2A contract: explicit interfaces, version negotiation, consistent outcomes</text></g></svg>